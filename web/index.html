<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>note - 记事本</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-left" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-right" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="app-header">
        <h1>note</h1>
        <p>Go + MySQL 记事本</p>
      </header>

      <section class="layout">
        <aside class="panel note-list-panel">
          <div class="panel-head">
            <h2>笔记列表</h2>
            <button id="new-note-btn" class="btn btn-ghost" type="button">新建</button>
          </div>

          <label class="search-wrap" for="search-input">
            <input id="search-input" type="search" placeholder="搜索标题或内容..." />
          </label>

          <ul id="note-list" class="note-list"></ul>
          <p id="list-empty" class="empty-hint hidden">还没有笔记，先创建第一条吧。</p>
        </aside>

        <section class="panel editor-panel">
          <div class="panel-head">
            <h2 id="editor-title">新建笔记</h2>
            <button id="delete-btn" class="btn btn-danger hidden" type="button">删除</button>
          </div>

          <form id="note-form" class="editor-form">
            <label class="field">
              <span>标题</span>
              <input id="title-input" name="title" type="text" maxlength="120" required />
            </label>

            <label class="field">
              <span>内容</span>
              <textarea id="content-input" name="content" rows="14" required></textarea>
            </label>

            <div class="form-actions">
              <button id="cancel-btn" class="btn btn-ghost hidden" type="button">取消编辑</button>
              <button id="save-btn" class="btn btn-primary" type="submit">保存笔记</button>
            </div>
          </form>

          <p id="status-msg" class="status-msg" role="status" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
